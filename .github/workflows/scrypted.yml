name: Scrypted Plugin Install Baseline
on:
  workflow_dispatch:
    inputs:
      scrypted_ref:
        description: scrypted git ref to test
        required: true
        type: string
        default: main
      portable_python:
        description: npm spec for portable-python (blank = the version pinned by scrypted's server/package.json)
        required: false
        type: string
      exclude:
        description: comma separated plugin directories to skip
        required: false
        type: string
        default: rknn
      install_system_libs:
        description: install libvips and GObject/GStreamer on Linux and macOS (as scrypted's installers do) so the pyvips and GStreamer checks run instead of skipping
        required: false
        type: boolean
        default: true
      smoke_checks:
        description: after installing, run functional smoke checks that exercise each plugin's dependencies (smoke_checks.py)
        required: false
        type: boolean
        default: true
      restore_lorem_ipsum:
        description: work around portable-python zips missing setuptools' 'Lorem ipsum.txt' (zip step dropped filenames with spaces); turn off to test fixed builds
        required: false
        type: boolean
        default: true
jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: koush/scrypted
          ref: ${{ inputs.scrypted_ref }}
          path: scrypted

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install portable-python
        shell: bash
        run: |
          SPEC="${{ inputs.portable_python }}"
          if [ -z "$SPEC" ]; then
            SPEC=$(node -p "require('./scrypted/server/package.json').dependencies.py")
          fi
          echo "portable-python: $SPEC"
          mkdir -p work && cd work
          npm init -y >/dev/null
          npm install "py@$SPEC"
          echo "installed: $(node -p "require('py/package.json').version")"

      - name: Install system libraries (libvips, GObject, GStreamer)
        if: ${{ inputs.install_system_libs }}
        shell: bash
        run: |
          # python-codecs' optional requirements (pyvips, PyGObject) and its gstreamer/vips code paths
          # need these; scrypted's installers provide them. Windows doesn't use them.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libvips42t64 libcairo2-dev pkg-config \
              libgirepository-2.0-dev libgirepository1.0-dev \
              gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install vips gstreamer gobject-introspection cairo pkg-config
            PREFIX="$(brew --prefix)"
            # pyvips dlopen()s libvips by name; keep the default fallback dirs too
            echo "DYLD_FALLBACK_LIBRARY_PATH=$PREFIX/lib:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"
            echo "GI_TYPELIB_PATH=$PREFIX/lib/girepository-1.0" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "SMOKE_REQUIRE_SYSTEM_LIBS=true" >> "$GITHUB_ENV"
          fi

      - name: Install plugin python requirements
        shell: bash
        working-directory: work
        env:
          # pypi downloads on hosted runners occasionally time out
          PIP_RETRIES: 5
          PIP_DEFAULT_TIMEOUT: 60
          RESTORE_LOREM_IPSUM: ${{ inputs.restore_lorem_ipsum }}
          SMOKE_CHECKS: ${{ inputs.smoke_checks }}
        run: |
          node ../.github/scripts/install-plugins.js "$GITHUB_WORKSPACE/scrypted" "$PWD/state" "${{ inputs.exclude }}"
