name: Scrypted Plugin Install Baseline
on:
  workflow_dispatch:
    inputs:
      scrypted_ref:
        description: scrypted git ref to test
        required: true
        type: string
        default: main
      portable_python:
        description: npm spec for portable-python (blank = the version pinned by scrypted's server/package.json)
        required: false
        type: string
      exclude:
        description: comma separated plugin directories to skip
        required: false
        type: string
        default: rknn
jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: koush/scrypted
          ref: ${{ inputs.scrypted_ref }}
          path: scrypted

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install portable-python
        shell: bash
        run: |
          SPEC="${{ inputs.portable_python }}"
          if [ -z "$SPEC" ]; then
            SPEC=$(node -p "require('./scrypted/server/package.json').dependencies.py")
          fi
          echo "portable-python: $SPEC"
          mkdir -p work && cd work
          npm init -y >/dev/null
          npm install "py@$SPEC"
          echo "installed: $(node -p "require('py/package.json').version")"

      - name: Install plugin python requirements
        shell: bash
        working-directory: work
        run: |
          node ../.github/scripts/install-plugins.js "$GITHUB_WORKSPACE/scrypted" "$PWD/state" "${{ inputs.exclude }}"
